<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b6af0"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="512" height="256" rx="112" fill="url(#shine)"/>

  <!-- Plate (circle) -->
  <circle cx="256" cy="272" r="148" fill="rgba(255,255,255,0.15)"/>
  <circle cx="256" cy="272" r="148" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="6"/>
  <!-- Inner plate ring -->
  <circle cx="256" cy="272" r="110" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>

  <!-- Fork (left of plate) -->
  <g fill="white" opacity="0.95">
    <!-- Fork handle -->
    <rect x="148" y="320" width="10" height="60" rx="5"/>
    <!-- Fork tines -->
    <rect x="145" y="210" width="4" height="50" rx="2"/>
    <rect x="152" y="210" width="4" height="50" rx="2"/>
    <rect x="159" y="210" width="4" height="50" rx="2"/>
    <!-- Fork neck -->
    <rect x="148" y="258" width="10" height="62" rx="3"/>
  </g>

  <!-- Knife (right of plate) -->
  <g fill="white" opacity="0.95">
    <!-- Knife handle -->
    <rect x="352" y="320" width="10" height="60" rx="5"/>
    <!-- Knife blade -->
    <path d="M352 210 Q362 230 362 270 L352 270 Z" />
    <!-- Knife neck -->
    <rect x="352" y="268" width="10" height="54" rx="3"/>
  </g>

  <!-- Calendar icon on plate -->
  <g transform="translate(206, 222)">
    <!-- Calendar body -->
    <rect x="0" y="12" width="100" height="80" rx="10" fill="rgba(255,255,255,0.92)"/>
    <!-- Calendar header -->
    <rect x="0" y="12" width="100" height="28" rx="10" fill="white"/>
    <rect x="0" y="28" width="100" height="12" fill="white"/>
    <!-- Header text line -->
    <rect x="20" y="19" width="60" height="8" rx="4" fill="#8b5cf6"/>
    <!-- Ring pins -->
    <rect x="28" y="8" width="8" height="16" rx="4" fill="rgba(255,255,255,0.8)"/>
    <rect x="64" y="8" width="8" height="16" rx="4" fill="rgba(255,255,255,0.8)"/>
    <!-- Grid dots -->
    <rect x="12" y="50" width="10" height="8" rx="2" fill="#5b6af0" opacity="0.7"/>
    <rect x="30" y="50" width="10" height="8" rx="2" fill="#5b6af0" opacity="0.7"/>
    <rect x="48" y="50" width="10" height="8" rx="2" fill="#8b5cf6"/>
    <rect x="66" y="50" width="10" height="8" rx="2" fill="#5b6af0" opacity="0.7"/>
    <rect x="78" y="50" width="10" height="8" rx="2" fill="#5b6af0" opacity="0.4"/>
    <rect x="12" y="66" width="10" height="8" rx="2" fill="#5b6af0" opacity="0.4"/>
    <rect x="30" y="66" width="10" height="8" rx="2" fill="#8b5cf6"/>
    <rect x="48" y="66" width="10" height="8" rx="2" fill="#5b6af0" opacity="0.7"/>
    <rect x="66" y="66" width="10" height="8" rx="2" fill="#5b6af0" opacity="0.4"/>
  </g>
</svg>
